<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Foodieland. | Main Page</title>
</head>

<body>

    <!-- Header -->
    <header class="container header-section">
        <div class="logo">Foodieland<span>.</span></div>
        <div class="nav-menu">
            <a href="#">Home</a>
            <a href="#">Recipes</a>
            <a href="#">Blog</a>
            <a href="#">Contact</a>
            <a href="#">About us</a>
        </div>
        <div class="social-img">
            <img src="img/icon/facebook-icon.png" alt="facebook">
            <img src="img/icon/twitter-icon.png" alt="twitter">
            <img src="img/icon/instagram-icon.png" alt="instagram">
        </div>
    </header>

    <hr>

    <main>
        <!-- Hero-block -->
        <!-- <div class="left-elem"></div> -->
        <div class="hero container">
            <div class="hero-text">
                <span id="main-tags-hero">Hot Recipes</span>
                <h1>Spicy delicious chicken wings</h1>
                <p>Lorem ipsum dolor sit amet, consectetuipisicing elit, sed do eiusmod tempor incididunt ut labore et
                    dolore magna aliqut enim ad minim </p>
                <div class="tags">
                    <span id="tags-hero-1">30 Minutes</span>
                    <span id="tags-hero-2">Chicken</span>
                </div>
                <div class="author-and-button">
                    <div class="author">
                        <div class="avatar">
                            <img src="img/avatar.png" alt="Avatar">
                        </div>
                        <div class="info">
                            <span id="name">John Smith</span>
                            <span id="date">15 March 2022</span>
                        </div>
                    </div>
                    <button class="hero-button">View Recipes</button>
                </div>
            </div>
            <div class="hero-img">
                <img src="img/hero-img.png" alt="Hero Image">
            </div>
        </div>
        <!-- <div class="right-elem"></div> -->
    </main>
</body>

</html>
